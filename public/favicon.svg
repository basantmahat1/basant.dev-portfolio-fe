<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#141b27;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0b865;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D67049;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b85530;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bgGrad)"/>
  <!-- Subtle inner border glow -->
  <rect width="512" height="512" rx="100" ry="100" fill="none" stroke="#D67049" stroke-width="2" opacity="0.25"/>
  <!-- Letter B with glow -->
  <text
    x="256"
    y="355"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="320"
    font-weight="700"
    text-anchor="middle"
    fill="url(#letterGrad)"
    filter="url(#glow)"
  >B</text>
</svg>
